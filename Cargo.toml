[package]
name = "codlet"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
autoexamples = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tempfile = "3.20"
url = "2.5"

[target.'cfg(windows)'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "hickory-dns"] }
tokio = { version = "1", features = ["rt", "time", "net", "sync", "macros"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Console",
    "Win32_System_Environment",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[[bin]]
name = "codlet"
path = "src/main.rs"

[[bin]]
name = "codlet-fake-child"
path = "src/bin/codlet-fake-child.rs"

[[bin]]
name = "codlet-lab"
path = "src/bin/codlet-lab.rs"

[[bin]]
name = "codlet-fake-host"
path = "src/bin/codlet-fake-host.rs"
