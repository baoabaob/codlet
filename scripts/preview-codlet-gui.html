<!doctype html>
<html lang="zh" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Codlet · 官方组件预览</title>
<style>
:root{font:14px/1.5 system-ui,sans-serif;color-scheme:light;color:#1b1b1b;background:#fff;--host-sidebar:#f7f7f7;--host-hover:#ececec;--host-border:#eee}
:root[data-theme=dark]{color-scheme:dark;color:#eee;background:#181818;--host-sidebar:#202020;--host-hover:#303030;--host-border:#303030}
*{box-sizing:border-box}body{margin:0;height:100dvh;display:grid;grid-template-rows:36px minmax(0,1fr) 36px}
.preview-header{font-size:12px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--host-border);gap:16px;color:GrayText}
.preview-shell{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:0}.preview-sidebar{padding:16px 8px;background:var(--host-sidebar)}
.preview-nav-button{display:flex;align-items:center;gap:8px;width:100%;height:36px;padding:0 12px;border:0;border-radius:8px;background:transparent;color:inherit;font:inherit;text-align:left;cursor:default}
.preview-nav-button:hover,.preview-nav-button[aria-current=page]{background:var(--host-hover)}.preview-nav-button:focus-visible{outline:2px solid Highlight;outline-offset:-2px}
.preview-main{min-height:0;overflow:hidden}.preview-placeholder{padding:48px}.preview-footer{border-top:1px solid var(--host-border);display:flex;align-items:center;gap:12px;padding:0 12px;font-size:12px}
.preview-footer label{display:flex;align-items:center;gap:4px}.preview-footer select,.preview-footer button{font:inherit;color:inherit;background:transparent;border:1px solid var(--host-border);border-radius:4px}
#preview-error{color:#d33;margin-left:auto} @media(max-width:700px){.preview-shell{grid-template-columns:132px minmax(0,1fr)}.preview-footer{gap:6px}.preview-header{font-size:10px}} @media(max-width:500px){.preview-shell{grid-template-columns:92px minmax(0,1fr)}.preview-nav-button{padding:0 8px;font-size:12px}.preview-footer{flex-wrap:wrap;font-size:10px}body{grid-template-rows:28px minmax(0,1fr) 54px}}
</style></head><body>
<header class="preview-header"><span>Codlet UI 预览</span><span>模拟宿主和运行时 · 页面使用实际官方组件</span><span id="preview-error" role="alert"></span></header>
<div class="preview-shell"><aside class="preview-sidebar"><nav aria-label="主导航"><button class="preview-nav-button" id="tasks">任务</button><button class="preview-nav-button" id="scheduled">定时任务</button></nav></aside><main class="preview-main" id="main"></main></div>
<footer class="preview-footer" aria-label="预览控制"><label>主题 <select id="theme"><option value="light">浅色</option><option value="dark">深色</option></select></label><label>语言 <select id="language"><option value="zh">中文</option><option value="en">English</option></select></label><label><input id="long" type="checkbox">长列表</label><label><input id="failure" type="checkbox">列表失败</label><button id="unload">卸载界面</button><button id="reload">重载界面</button></footer>
<script type="module">
import {createPreviewRuntime} from './preview-runtime.mjs';
const runtime=createPreviewRuntime(),params=new URLSearchParams(location.search),main=document.getElementById('main'),nav=document.querySelector('nav');
const [uiSource,guiSource,i18nSource]=await Promise.all(['../bundled/runtime/ui.js','../bundled/codlet/dist/renderer.js','../bundled/runtime/i18n.js'].map(url=>fetch(url).then(r=>r.text())));
const createUI=(0,eval)(uiSource),createI18n=(0,eval)(i18nSource),module={exports:{}};new Function('module','exports',guiSource)(module,module.exports);const gui=module.exports;
let generation=0,context;const cleanups=new Set();
function show(id,token){main.replaceChildren();for(const button of nav.children)button.removeAttribute('aria-current');document.getElementById(id)?.setAttribute('aria-current','page');const page=document.createElement('div');page.style.height='100%';if(token)page.dataset.codletPageHost=token;else{page.className='preview-placeholder';page.textContent=id==='tasks'?'任务页面':'定时任务页面';}main.appendChild(page);}
for(const id of ['tasks','scheduled'])document.getElementById(id).onclick=()=>show(id);
function stop(){gui.deactivate();for(const fn of [...cleanups])fn();cleanups.clear();document.getElementById('codlet')?.remove();show('tasks');}
async function activate(){stop();context={pluginId:'codlet-gui',generation:++generation,onDeactivate(fn){cleanups.add(fn);return()=>cleanups.delete(fn);},reportDiagnostic(e){document.getElementById('preview-error').textContent=e.message;},rpc:{request:async(cap,method,args)=>{
  if(cap.name==='codex.ui.navigation.page'&&method==='register'){
    const button=document.createElement('button');button.id='codlet';button.className='preview-nav-button';button.textContent=args.label;button.dataset.codletNavigationEntry='codlet-gui';button.onclick=()=>show('codlet',args.token);nav.appendChild(button);return {api:1,token:args.token,path:'/codlet/codlet-gui'};
  }
  return runtime.request(cap,method,args);
}}};context.i18n=createI18n(context);context.ui={api:2,create:()=>createUI(context)};await gui.activate(context);document.getElementById('codlet')?.click();}
document.getElementById('theme').value=params.get('theme')||'light';document.documentElement.dataset.theme=document.getElementById('theme').value;
document.getElementById('language').value=params.get('lang')||'zh';document.documentElement.lang=document.getElementById('language').value;
document.getElementById('theme').onchange=e=>document.documentElement.dataset.theme=e.target.value;
document.getElementById('language').onchange=e=>document.documentElement.lang=e.target.value;
document.getElementById('long').onchange=e=>{runtime.state.long=e.target.checked;document.querySelector('[aria-label="刷新插件"],[aria-label="Refresh plugins"]')?.click();};
document.getElementById('failure').onchange=e=>{runtime.state.failure=e.target.checked;document.querySelector('[aria-label="刷新插件"],[aria-label="Refresh plugins"]')?.click();};
document.getElementById('unload').onclick=stop;document.getElementById('reload').onclick=activate;
runtime.state.phase=params.get('phase')||'development';await activate();
</script></body></html>
