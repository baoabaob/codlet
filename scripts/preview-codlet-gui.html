<!doctype html>
<html lang="zh" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Codlet · 官方组件预览</title>
<style>
:root{font:16px/1.5 system-ui,sans-serif;color-scheme:light;color:#1b1b1b;background:#fff;--host-sidebar:#f7f7f7;--host-hover:#ececec;--host-border:#eee;--color-surface:#fff;--color-text:#1b1b1b;--color-text-secondary:#777;--color-border:#eee;--color-border-primary-outline:rgba(0,0,0,.16);--color-background-page-search:#fff;--thread-content-max-width:48rem;--padding-panel:20px;--color-chart-blue:#ff7835;--color-control-thumb-on-accent:white;--color-ring:#e9772d;--color-text-warning:#aa7600}
:root[data-theme=dark]{color-scheme:dark;color:#eee;background:#181818;--host-sidebar:#202020;--host-hover:#303030;--host-border:#303030;--color-surface:#181818;--color-text:#eee;--color-text-secondary:#aaa;--color-border:#303030;--color-border-primary-outline:rgba(255,255,255,.25);--color-background-page-search:#303030;--color-text-warning:#e8b63e}
*{box-sizing:border-box}body{font-size:14px;margin:0;height:100dvh;display:grid;grid-template-rows:36px minmax(0,1fr) auto}
.preview-header{font-size:12px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--host-border);gap:16px;color:GrayText}
.preview-shell{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:0}.preview-sidebar{padding:16px 8px;background:var(--host-sidebar)}
.preview-nav-button{display:flex;align-items:center;gap:8px;width:100%;height:36px;padding:0 12px;border:0;border-radius:8px;background:transparent;color:inherit;font:inherit;text-align:left;cursor:default}
.preview-nav-button:hover,.preview-nav-button[aria-current=page]{background:var(--host-hover)}.preview-nav-button:focus-visible{outline:2px solid Highlight;outline-offset:-2px}
.preview-main{display:flex;flex-direction:column;min-height:0;overflow:hidden}#native-toolbar{overflow:hidden;contain:paint;flex:0 0 46px;display:flex;align-items:center;padding:0 8px}#native-toolbar>div{width:100%}#main{flex:1;min-height:0;overflow:hidden}.preview-placeholder{padding:48px}.preview-footer{border-top:1px solid var(--host-border);display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 12px;font-size:12px}
.preview-footer label{display:flex;align-items:center;gap:4px}.preview-footer select,.preview-footer button{font:inherit;color:inherit;background:transparent;border:1px solid var(--host-border);border-radius:4px}
#preview-error{color:#d33;margin-left:auto} @media(max-width:700px){.preview-shell{grid-template-columns:132px minmax(0,1fr)}.preview-footer{gap:6px}.preview-header{font-size:10px}} @media(max-width:500px){.preview-shell{grid-template-columns:92px minmax(0,1fr)}.preview-nav-button{padding:0 8px;font-size:12px}.preview-footer{flex-wrap:wrap;font-size:10px}body{grid-template-rows:28px minmax(0,1fr) auto}.preview-footer{max-height:180px;overflow:auto}}
</style></head><body>
<header class="preview-header"><span>Codlet UI 预览</span><span>模拟宿主和运行时 · 页面使用实际官方组件</span><span id="preview-error" role="alert"></span></header>
<div class="preview-shell"><aside class="preview-sidebar"><nav aria-label="主导航"><button class="preview-nav-button" id="tasks">任务</button><button class="preview-nav-button" id="scheduled">定时任务</button></nav></aside><main class="preview-main"><div id="native-toolbar" data-app-shell-header-toolbar=""></div><div id="main"></div></main></div>
<footer class="preview-footer" aria-label="预览控制"><label>主题 <select id="theme"><option value="light">浅色</option><option value="dark">深色</option></select></label><label>语言 <select id="language"><option value="zh">中文</option><option value="en">English</option></select></label>
<label>Codlet状态 <select id="phase"><option value="development">未配置源</option><option value="idle">未检查</option><option value="checking">检查中</option><option value="upToDate">已是最新</option><option value="available">有更新</option><option value="downloading">下载中</option><option value="downloaded">已下载</option><option value="installRequested">安装中</option><option value="failed">失败</option></select></label>
<label>客户端适配 <select id="client-status"><option value="matched">已匹配</option><option value="unknown">未知</option><option value="unmatched">不匹配</option></select></label><label><input id="dependents" type="checkbox">依赖链</label>
<label><input id="known-candidate" type="checkbox">已确认候选</label><label><input id="version-failure" type="checkbox">版本读取失败</label><label><input id="settings-failure" type="checkbox">设置失败</label><label><input id="long" type="checkbox">长列表</label><label><input id="failure" type="checkbox">列表失败</label><button id="unload">卸载界面</button><button id="reload">重载界面</button><span>状态由页面自动轮询读取（最多5秒）</span></footer>
<script type="module">
import {createPreviewRuntime} from './preview-runtime.mjs';
const runtime=createPreviewRuntime(),params=new URLSearchParams(location.search),main=document.getElementById('main'),nav=document.querySelector('nav');
const [uiSource,guiSource,i18nSource]=await Promise.all(['../bundled/runtime/ui.js','../bundled/codlet/dist/renderer.js','../bundled/runtime/i18n.js'].map(url=>fetch(url).then(r=>r.text())));
const createUI=(0,eval)(uiSource),createI18n=(0,eval)(i18nSource),module={exports:{}};new Function('module','exports',guiSource)(module,module.exports);const gui=module.exports;
// The sidebar currently uses the same Cube glyph as the pinned Apps SDK UI.
const brand=new DOMParser().parseFromString('<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M12.5 3.444a1 1 0 0 0-1 0l-6.253 3.61 6.768 3.807 6.955-3.682-6.47-3.735Zm7.16 5.632L13 12.602v7.666l6.16-3.556a1 1 0 0 0 .5-.867V9.076ZM11 20.268v-7.683L4.34 8.839v7.006a1 1 0 0 0 .5.867L11 20.268Zm-.5-18.557a3 3 0 0 1 3 0l6.66 3.846a3 3 0 0 1 1.5 2.598v7.69a3 3 0 0 1-1.5 2.598L13.5 22.29a3 3 0 0 1-3 0l-6.66-3.846a3 3 0 0 1-1.5-2.598v-7.69a3 3 0 0 1 1.5-2.598L10.5 1.71Z"/></svg>','image/svg+xml').documentElement;
let generation=0,context;const cleanups=new Set();
function show(id,token,withToolbar){main.replaceChildren();const header=document.getElementById('native-toolbar');header.replaceChildren();if(token&&withToolbar){const slot=document.createElement('div');slot.dataset.codletPageToolbar=token;header.append(slot);}for(const button of nav.children)button.removeAttribute('aria-current');document.getElementById(id)?.setAttribute('aria-current','page');const page=document.createElement('div');page.style.height='100%';if(token)page.dataset.codletPageHost=token;else{page.className='preview-placeholder';page.textContent=id==='tasks'?'任务页面':'定时任务页面';}main.appendChild(page);}
for(const id of ['tasks','scheduled'])document.getElementById(id).onclick=()=>show(id);
function stop(){gui.deactivate();for(const fn of [...cleanups])fn();cleanups.clear();document.getElementById('codlet')?.remove();show('tasks');}
async function activate(){stop();context={pluginId:'codlet-gui',generation:++generation,onDeactivate(fn){cleanups.add(fn);return()=>cleanups.delete(fn);},reportDiagnostic(e){document.getElementById('preview-error').textContent=e.message;},rpc:{request:async(cap,method,args)=>{
  if(cap.name==='codex.ui.navigation.page'&&method==='register'){
    const button=document.createElement('button');button.id='codlet';button.className='preview-nav-button';button.append(document.importNode(brand,true),args.label);button.dataset.codletNavigationEntry='codlet-gui';button.onclick=()=>show('codlet',args.token,args.toolbar);nav.appendChild(button);return {api:1,token:args.token,path:'/codlet/codlet-gui'};
  }
  return runtime.request(cap,method,args);
}}};context.i18n=createI18n(context);context.ui={api:2,create:()=>createUI(context)};await gui.activate(context);document.getElementById('codlet')?.click();}
document.getElementById('theme').value=params.get('theme')||'light';document.documentElement.dataset.theme=document.getElementById('theme').value;
document.getElementById('language').value=params.get('lang')||'zh';document.documentElement.lang=document.getElementById('language').value;
document.getElementById('theme').onchange=e=>document.documentElement.dataset.theme=e.target.value;
document.getElementById('language').onchange=e=>document.documentElement.lang=e.target.value;
document.getElementById('long').onchange=e=>{runtime.state.long=e.target.checked;document.querySelector('[aria-label="刷新插件"],[aria-label="Refresh plugins"]')?.click();};
document.getElementById('dependents').onchange=e=>{runtime.state.dependents=e.target.checked;document.querySelector('[aria-label="刷新插件"],[aria-label="Refresh plugins"]')?.click();};
document.getElementById('failure').onchange=e=>{runtime.state.failure=e.target.checked;document.querySelector('[aria-label="刷新插件"],[aria-label="Refresh plugins"]')?.click();};
document.getElementById('unload').onclick=stop;document.getElementById('reload').onclick=activate;
document.getElementById('phase').value=runtime.state.phase=params.get('phase')||'development';
if(['ready','downloading'].includes(params.get('official')))runtime.state.officialUpdate={available:true,restartPreserved:true,phase:params.get('official'),isUpdateReady:params.get('official')==='ready',combinedPhase:'idle',error:null};
document.getElementById('client-status').value=runtime.state.client=params.get('client')||'matched';
document.getElementById('phase').onchange=e=>{runtime.state.phase=e.target.value;runtime.state.checkedAt=Date.now();if(['available','downloading','downloaded','installRequested'].includes(e.target.value))runtime.state.knownCandidate=true;else if(['development','idle','upToDate'].includes(e.target.value))runtime.state.knownCandidate=false;document.getElementById('known-candidate').checked=runtime.state.knownCandidate;};
document.getElementById('client-status').onchange=e=>{runtime.state.client=e.target.value;runtime.state.checkedAt=Date.now();};
for(const [id,key] of [['known-candidate','knownCandidate'],['version-failure','versionFailure'],['settings-failure','settingsFailure']])document.getElementById(id).onchange=e=>runtime.state[key]=e.target.checked;
await activate();
</script></body></html>
