name: Publish pinned Node.js runtimes

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-node-runtimes
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify official Node.js archives and publish immutable assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/publish-node-runtimes.py
