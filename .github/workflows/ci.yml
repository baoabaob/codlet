name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows Core
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: node frontend/build.mjs
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Stage pinned Host runtime for executables and tests
        shell: pwsh
        run: |
          ./scripts/Install-JsRuntime.ps1 -Destination ./target/debug
          ./scripts/Install-JsRuntime.ps1 -Destination ./target/debug/deps
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features -- --test-threads=2

  windows-ui:
    name: Windows UI
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: node frontend/build.mjs
      - run: node --test --test-concurrency=2 tests/*.test.mjs

  windows-acceptance:
    name: Windows launch scripts
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        id: checkout
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\Test-M0Acceptance.ps1
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
      - run: pwsh -NoProfile -ExecutionPolicy Bypass -File .\scripts\Test-M0Acceptance.ps1
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\Test-M0CrashAcceptance.ps1
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
      - run: pwsh -NoProfile -ExecutionPolicy Bypass -File .\scripts\Test-M0CrashAcceptance.ps1
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}

  macos:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo check --locked --all-targets --all-features
      - name: Test platform-independent services on Apple silicon
        run: 'cargo test --locked --lib plugin_services::'
      - run: python3 scripts/install-js-runtime.py --destination target/debug/deps --platform darwin-arm64
      - run: 'cargo test --locked --lib core_resources::'
      - name: Test unreaped native process-group retirement
        run: 'cargo test --locked --lib macos::process_owner::tests::'
      - run: cargo test --locked --test macos_native -- --test-threads=2
