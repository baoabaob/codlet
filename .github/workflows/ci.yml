name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/*.md'
  pull_request:
    paths-ignore:
      - '*.md'
      - 'docs/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows Core
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: node frontend/build.mjs
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Stage pinned Host runtime for executables and tests
        shell: pwsh
        run: |
          ./scripts/Install-JsRuntime.ps1 -Destination ./target/debug
          ./scripts/Install-JsRuntime.ps1 -Destination ./target/debug/deps
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features -- --test-threads=2

  windows-ui:
    name: Windows UI
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: node frontend/build.mjs
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo build --locked --features test-fixtures --bin codlet-traffic-fixture
      - run: npm run typecheck --prefix frontend
      - run: node --test --test-concurrency=2 tests/*.test.mjs

  windows-acceptance:
    name: Windows launch scripts
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        id: checkout
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\Test-M0Acceptance.ps1
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
      - run: pwsh -NoProfile -ExecutionPolicy Bypass -File .\scripts\Test-M0Acceptance.ps1
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\Test-M0CrashAcceptance.ps1
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
      - run: pwsh -NoProfile -ExecutionPolicy Bypass -File .\scripts\Test-M0CrashAcceptance.ps1
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\Test-DistributionEncoding.ps1
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
      - run: pwsh -NoProfile -ExecutionPolicy Bypass -File .\scripts\Test-DistributionEncoding.ps1
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\Test-WindowsInstaller.ps1 -ArtifactsDirectory .codlet-artifacts/installer-ci
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\Test-NativeInstaller.ps1 -ArtifactsDirectory .codlet-artifacts/native-installer-ci
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File .\tests\windows-launcher.test.ps1
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\Test-Release.ps1
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}

  macos:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: python3 tests/test_macos_distribution.py
      - name: Test all native Core targets and features on Apple silicon
        run: sh scripts/test-macos.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: node frontend/build.mjs
      - run: cargo build --locked --features test-fixtures --bin codlet-traffic-fixture
      - name: Test native HTTP, SSE, WS, WSS and plugin contracts
        run: node --test --test-concurrency=2 tests/native_traffic.test.mjs tests/host_traffic.test.mjs tests/plaintext_source.test.mjs tests/traffic_interceptors.test.mjs tests/traffic_profiles.test.mjs tests/traffic_wire.test.mjs tests/client_bridge.test.mjs
